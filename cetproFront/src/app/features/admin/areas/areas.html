<div class="page-container">
  <div class="page-header">
    <h1>Áreas</h1>
    <button mat-raised-button color="primary" (click)="crear()">
      <mat-icon>add</mat-icon> Nueva área
    </button>
  </div>

  @if (cargando()) {
    <mat-spinner diameter="40"></mat-spinner>
  } @else {
    <table mat-table [dataSource]="areas()" class="full-width mat-elevation-z2">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let area">{{ area.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let area">{{ area.descripcion || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let area">
          <mat-chip [color]="area.activo ? 'primary' : 'warn'" selected>
            {{ area.activo ? 'Activo' : 'Inactivo' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let area">
          <button mat-icon-button (click)="editar(area)" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminar(area)" title="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>

    @if (areas().length === 0) {
      <p class="empty-text">No hay áreas registradas todavía.</p>
    }
  }
</div>
