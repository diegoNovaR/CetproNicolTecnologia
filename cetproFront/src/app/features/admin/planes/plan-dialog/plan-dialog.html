<h2 mat-dialog-title>{{ esEdicion ? 'Editar plan de estudio' : 'Crear plan de estudio' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="dialog-content">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Curso</mat-label>
      <mat-select formControlName="cursoId">
        @for (curso of data.cursos; track curso.id) {
          <mat-option [value]="curso.id">{{ curso.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="tipo">
        <mat-option value="carrera_completa">Carrera completa</mat-option>
        <mat-option value="modulo">Módulo</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Duración (meses)</mat-label>
      <input matInput type="number" formControlName="duracionMeses" min="1" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Precio de matrícula</mat-label>
      <input matInput type="number" formControlName="precioMatricula" min="0" step="0.01" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Pensión mensual</mat-label>
      <input matInput type="number" formControlName="pensionMensual" min="0" step="0.01" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
